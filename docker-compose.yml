version: "3.9"

services:
  otp-service:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:////data/otp_service.db
      - SECRET_KEY=${SECRET_KEY}
      - SMS_MAGIC_API_URL=${SMS_MAGIC_API_URL}
      - SMS_MAGIC_ACCESS_KEY=${SMS_MAGIC_ACCESS_KEY}
      - SMS_MAGIC_SECRET_KEY=${SMS_MAGIC_SECRET_KEY}
      - SMS_MAGIC_SENDER_ID=${SMS_MAGIC_SENDER_ID}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - OTP_VALIDITY_SECONDS=${OTP_VALIDITY_SECONDS:-300}
      - OTP_MAX_ATTEMPTS=${OTP_MAX_ATTEMPTS:-3}
      - INCOMING_WEBHOOK_TOKEN=${INCOMING_WEBHOOK_TOKEN}
    volumes:
      - otp_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  otp_data:
